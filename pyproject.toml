[project]
name = "cooplink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.18.0",
    "celery>=5.6.3",
    "cryptography>=49.0.0",
    "django<5.2",
    "django-celery-beat>=2.9.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-unfold<0.99",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "pyrogram>=2.0.106",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "tgcrypto>=1.2.5",
    "whitenoise>=6.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated Django migrations routinely exceed the line length.
"**/migrations/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
