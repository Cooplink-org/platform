{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">
    <div class="module">
        <p>You are rejecting the project: <strong>{{ project.title }}</strong></p>
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <label for="reason">Reason for rejection (will be sent to seller):</label>
                <textarea name="reason" id="reason" rows="4" cols="60" required style="display:block; margin-top:10px;"></textarea>
            </div>
            <div class="submit-row" style="margin-top:20px;">
                <input type="submit" value="Confirm Rejection" class="default">
                <a href="{% url 'admin:listings_project_changelist' %}" class="button cancel-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
