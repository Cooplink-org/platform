<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>cooplink — dev playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d10;
    --surface:#14171b;
    --surface-2:#1b1f24;
    --border:#262b31;
    --text:#e7e9ec;
    --muted:#8a9099;
    --accent:#3fd68c;
    --accent-dim:#234a37;
    --money:#f5a623;
    --money-dim:#4a3a1c;
    --danger:#e5534b;
    --info:#58a6ff;
    --radius:10px;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  a{color:inherit;text-decoration:none;}
  button, input, select, textarea{font-family:inherit;}

  header{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:20px;
    padding:14px 24px;background:rgba(11,13,16,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .logo{font-family:var(--mono);font-weight:700;font-size:18px;display:flex;align-items:center;gap:2px;}
  .logo .cursor{display:inline-block;width:8px;height:16px;background:var(--accent);margin-left:2px;animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion: reduce){.logo .cursor{animation:none;}}
  header input[type="search"]{
    flex:1;max-width:420px;background:var(--surface);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:9px 12px;font-size:14px;
  }
  header input[type="search"]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .btn{
    border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    transition:border-color .15s,background .15s;
  }
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn:hover{border-color:var(--muted);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#06251a;}
  .btn.primary:hover{background:#35bf7c;}
  .btn.money{background:var(--money);border-color:var(--money);color:#2b1c02;}
  .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);}

  .dev-banner{
    background:var(--money-dim);color:var(--money);text-align:center;
    font-family:var(--mono);font-size:12px;padding:6px 16px;
  }

  main{max-width:1120px;margin:0 auto;padding:28px 24px 80px;}
  .eyebrow{font-family:var(--mono);color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px;}
  h1{font-size:26px;margin:0 0 4px;}
  h2{font-size:18px;margin:0 0 14px;}
  p.muted{color:var(--muted);font-size:14px;}

  /* ── tabs ─────────────────────────────────────────────── */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:18px 0 0;overflow-x:auto;}
  .tab{
    font-family:var(--mono);font-size:12px;padding:10px 16px;cursor:pointer;
    border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;
    color:var(--muted);background:transparent;white-space:nowrap;
    transition:color .15s,background .15s;
  }
  .tab:hover{color:var(--text);background:var(--surface);}
  .tab.active{color:var(--accent);background:var(--surface);border-color:var(--border);}
  .tab-content{display:none;padding:20px 0;}
  .tab-content.active{display:block;}

  /* ── filters ─────────────────────────────────────────── */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px;}
  .chip{
    font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--border);color:var(--muted);cursor:pointer;background:var(--surface);
    transition:all .15s;
  }
  .chip:hover{border-color:var(--accent-dim);color:var(--text);}
  .chip.active{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-dim);}

  /* ── grid / cards ────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;
  }
  .card:hover{border-color:var(--accent-dim);box-shadow:0 0 0 1px var(--accent-dim);}
  .card .thumb{height:120px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--muted);font-size:12px;overflow:hidden;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card h3{font-size:15px;margin:0;}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:2px 6px;}
  .price{font-family:var(--mono);color:var(--money);font-weight:600;font-size:14px;margin-top:auto;}
  .price::before{content:'$ ';opacity:.6;}

  /* ── detail ──────────────────────────────────────────── */
  .detail-top{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;}
  @media (max-width:760px){.detail-top{grid-template-columns:1fr;}}
  .shots{display:flex;gap:8px;overflow-x:auto;border-radius:8px;}
  .shots img{height:220px;border-radius:8px;border:1px solid var(--border);}
  .buybox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;height:fit-content;}
  .buybox .price{font-size:24px;margin-bottom:12px;}
  .seller-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted);}

  /* ── stats ───────────────────────────────────────────── */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color .15s;}
  .stat:hover{border-color:var(--accent-dim);}
  .stat .eyebrow{margin-bottom:8px;}
  .stat .value{font-family:var(--mono);font-size:22px;font-weight:600;}
  .stat.frozen .value{color:var(--money);}
  .stat.available .value{color:var(--accent);}

  /* ── table ───────────────────────────────────────────── */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:500;font-family:var(--mono);font-size:11px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);}
  .badge{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px;}
  .badge.paid, .badge.published, .badge.completed{background:var(--accent-dim);color:var(--accent);}
  .badge.pending_payment, .badge.pending_review, .badge.requested, .badge.processing{background:var(--money-dim);color:var(--money);}
  .badge.failed, .badge.rejected, .badge.refunded{background:#3a1f1d;color:var(--danger);}

  section{margin-bottom:32px;}

  /* ── form ────────────────────────────────────────────── */
  .form{display:flex;flex-direction:column;gap:14px;max-width:520px;}
  label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px;}
  input[type=text], input[type=number], input[type=url], input[type=password], select, textarea{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 12px;font-size:14px;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  textarea{min-height:90px;resize:vertical;}

  /* ── misc ────────────────────────────────────────────── */
  .empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:50;animation:slideIn .25s ease-out;}
  .toast.error{border-color:var(--danger);color:var(--danger);}
  .toast.success{border-color:var(--accent);color:var(--accent);}
  @keyframes slideIn{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .skeleton{background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:8px;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* ── api tester ──────────────────────────────────────── */
  .api-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .api-panel summary{cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600;padding:4px 0;}
  .api-panel summary .method{display:inline-block;min-width:50px;font-size:11px;padding:2px 6px;border-radius:4px;margin-right:8px;text-align:center;}
  .method.get{background:#1a3a2a;color:var(--accent);}
  .method.post{background:#3a2a1a;color:var(--money);}
  .method.patch{background:#1a2a3a;color:var(--info);}
  .method.delete{background:#3a1f1d;color:var(--danger);}
  .api-result{margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-all;}
  .api-result.ok{border-color:var(--accent-dim);}
  .api-result.err{border-color:#3a1f1d;color:var(--danger);}
  .api-input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:end;}
  .api-input-row label{font-size:12px;font-weight:500;gap:4px;}
  .api-input-row input, .api-input-row select{font-size:12px;padding:6px 8px;min-width:120px;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:8px;}
  .status-dot.ok{background:var(--accent);}
  .status-dot.err{background:var(--danger);}
  .status-dot.pending{background:var(--money);}

  /* ── product customization ──────────────────────────────── */
  .banner{width:100%;height:220px;border-radius:var(--radius);overflow:hidden;margin-bottom:22px;border:1px solid var(--border);background:var(--surface-2);}
  .banner img{width:100%;height:100%;object-fit:cover;display:block;}
  .featured-text{color:var(--accent);font-weight:600;font-family:var(--mono);font-size:12px;}
  .badge.featured{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-dim);margin-bottom:8px;display:inline-block;}
  ul.highlights{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:8px;}
  ul.highlights li{position:relative;padding-left:22px;font-size:14px;color:var(--text);}
  ul.highlights li::before{content:"✦";position:absolute;left:0;color:var(--accent);}
  .card-body{display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-hl{font-size:13px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* ── markdown (rendered, escaped) ──────────────────────── */
  .md{font-size:14px;line-height:1.7;color:var(--text);}
  .md .md-h{margin:18px 0 8px;line-height:1.3;}
  .md .md-h:first-child{margin-top:0;}
  .md .md-p{margin:0 0 12px;color:var(--muted);}
  .md .md-p code, .md code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--accent);}
  .md .md-quote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--accent-dim);background:var(--surface);border-radius:0 6px 6px 0;color:var(--muted);}
  .md .md-list{margin:0 0 12px;padding-left:20px;color:var(--muted);}
  .md .md-list li{margin:4px 0;}

  /* ── filter toolbar ─────────────────────────────────────── */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 0;}
  .field{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;min-width:140px;}
  .field:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field.num{width:110px;min-width:0;}
  .field-check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  @media (max-width:640px){.field{flex:1 1 100%;}}
</style>
</head>
<body>

<div class="dev-banner">⚠ DEV PLAYGROUND — NOT FOR PRODUCTION — this page is an API tester for all Cooplink endpoints</div>

<header>
  <a href="#/" class="logo">cooplink<span class="cursor"></span></a>
  <input type="search" id="search-input" placeholder="Search projects, tags, tech..." />
  <div class="nav-right" id="nav-right"></div>
</header>

<main id="app"></main>

<script>
/*
 * ══════════════════════════════════════════════════════════════════════════
 *  cooplink — DEV PLAYGROUND
 *
 *  This HTML file is a lightweight SPA for rapid development & manual
 *  API testing.  It is NOT intended for production use — no CSRF, no
 *  error boundaries, minimal accessibility, no SSR, no i18n, etc.
 *
 *  Point API_BASE at your running backend (default http://localhost:8000).
 * ══════════════════════════════════════════════════════════════════════════
 */
const API_BASE = window.location.protocol.startsWith("http") 
  ? "" 
  : "http://localhost:8000";

/* ── state ─────────────────────────────────────────────────────────── */
const state = {
  token: localStorage.getItem("cooplink_token") || null,
  user: JSON.parse(localStorage.getItem("cooplink_user") || "null"),
};

function setAuth(token, user){
  state.token = token; state.user = user;
  if (token) { localStorage.setItem("cooplink_token", token); localStorage.setItem("cooplink_user", JSON.stringify(user)); }
  else { localStorage.removeItem("cooplink_token"); localStorage.removeItem("cooplink_user"); }
  renderHeader();
  render();
}

function toast(msg, isError){
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : " success");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(path, opts = {}){
  const headers = Object.assign({}, opts.headers);
  if (!(opts.body instanceof FormData)) headers["Content-Type"] = "application/json";
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { setAuth(null, null); throw new Error("Session expired — please log in again."); }
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || JSON.stringify(j); } catch (e) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res;
}

/** Raw API call — returns {status, ok, body} without throwing */
async function apiRaw(path, opts = {}){
  const headers = Object.assign({}, opts.headers);
  if (!(opts.body instanceof FormData)) headers["Content-Type"] = "application/json";
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let body;
  const ct = res.headers.get("content-type") || "";
  try { body = ct.includes("json") ? await res.json() : await res.text(); } catch(e) { body = null; }
  return { status: res.status, ok: res.ok, body };
}

function money(n){ return Number(n || 0).toLocaleString("en-US"); }
function fmtDate(d){
  if (!d) return "—";
  return new Date(d).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function fmtDateTime(d){
  if (!d) return "—";
  return new Date(d).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function statusDot(ok){ return `<span class="status-dot ${ok ? 'ok' : 'err'}"></span>`; }

/* ── query string helpers ──────────────────────────────────────────── */
function readQuery(){
  const [_, q] = (location.hash || "#/").split("?");
  return Object.fromEntries(new URLSearchParams(q || ""));
}
function updateQuery(patch, resetPage = true){
  const q = readQuery();
  if (resetPage) delete q.page;
  Object.assign(q, patch);
  Object.keys(q).forEach(k => { if (q[k] === "" || q[k] == null) delete q[k]; });
  const s = new URLSearchParams(q).toString();
  location.hash = "#/" + (s ? "?" + s : "");
}

/* ── minimal, safe markdown renderer ───────────────────────────────────
   Supports: # headings, **bold**, *italic*, `code`, > quote, - lists,
   links [text](url), paragraphs and line breaks. Output is escaped first,
   so user content can never inject raw HTML. */
function renderMarkdown(md){
  if (!md) return "";
  const esc = s => escapeHtml(s);
  const lines = String(md).replace(/\r\n/g, "\n").split("\n");
  let html = "", listOpen = false;
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  const closeList = () => { if (listOpen) { html += "</ul>"; listOpen = false; } };
  for (const raw of lines){
    const line = raw.trimEnd();
    if (/^\s*[-*]\s+/.test(line)){
      if (!listOpen) { html += "<ul class=\"md-list\">"; listOpen = true; }
      html += `<li>${inline(line.replace(/^\s*[-*]\s+/, ""))}</li>`;
      continue;
    }
    closeList();
    if (!line.trim()) continue;
    if (/^#{1,3}\s+/.test(line)){ const lvl = line.match(/^#+/)[0].length; html += `<h${lvl} class="md-h">${inline(line.replace(/^#{1,3}\s+/, ""))}</h${lvl}>`; continue; }
    if (/^>\s?/.test(line)){ html += `<blockquote class="md-quote">${inline(line.replace(/^>\s?/, ""))}</blockquote>`; continue; }
    html += `<p class="md-p">${inline(line)}</p>`;
  }
  closeList();
  return html;
}

/* Apply a seller-chosen accent color to the current product page. */
function applyAccent(color){
  const el = document.getElementById("product-accent");
  if (!el) return;
  const safe = /^#[0-9a-fA-F]{3,8}$/.test(color || "") ? color : "#3fd68c";
  el.textContent = `:root{--accent:${safe};--accent-dim:${safe}33;}`;
}

/* ── header ─────────────────────────────────────────────────────────── */
function renderHeader(){
  const el = document.getElementById("nav-right");
  if (state.user) {
    el.innerHTML = `
      <a class="btn" href="#/sell">Sell a project</a>
      <a class="btn" href="#/dashboard">Dashboard</a>
      <a class="btn" href="#/api-tester">🧪 API Tester</a>
      <a href="#/dashboard" title="${escapeHtml(state.user.github_username || state.user.username)}">
        <img class="avatar" src="${escapeHtml(state.user.avatar_url || '')}" alt="" onerror="this.style.visibility='hidden'"/>
      </a>
      <button class="btn danger" id="logout-btn">Log out</button>
    `;
    document.getElementById("logout-btn").onclick = () => { setAuth(null, null); location.hash = "#/"; };
  } else {
    el.innerHTML = `
      <a class="btn" href="#/api-tester">🧪 API Tester</a>
      <button class="btn primary" id="login-btn">Log in with GitHub</button>
    `;
    document.getElementById("login-btn").onclick = async () => {
      try {
        const data = await api("/api/auth/github/login/");
        if (data.authorization_url) window.location = data.authorization_url;
        else toast("Login endpoint did not return an authorization_url.", true);
      } catch (err) {
        toast("Failed to start GitHub login: " + err.message, true);
      }
    };
  }
}

document.getElementById("search-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    location.hash = "#/?q=" + encodeURIComponent(e.target.value);
  }
});

/* ── router ─────────────────────────────────────────────────────────── */
const routes = [];
function route(pattern, handler){ routes.push({ pattern, handler }); }

function matchRoute(hash){
  const [pathPart, queryPart] = hash.replace(/^#/, "").split("?");
  const query = Object.fromEntries(new URLSearchParams(queryPart || ""));
  for (const r of routes) {
    const keys = [];
    const regex = new RegExp("^" + r.pattern.replace(/:[^/]+/g, m => { keys.push(m.slice(1)); return "([^/]+)"; }) + "$");
    const m = pathPart.match(regex);
    if (m) {
      const params = {};
      keys.forEach((k, i) => params[k] = decodeURIComponent(m[i + 1]));
      return { handler: r.handler, params, query };
    }
  }
  return null;
}

async function render(){
  const app = document.getElementById("app");
  const matched = matchRoute(location.hash || "#/");
  if (!matched) { app.innerHTML = `<div class="empty">Page not found. <a href="#/">Back to marketplace</a></div>`; return; }
  app.innerHTML = `<div class="skeleton" style="height:200px;"></div>`;
  try {
    await matched.handler(matched.params, matched.query);

/* ══════════════════════════════════════════════════════════════════════
   GitHub OAuth callback
   ══════════════════════════════════════════════════════════════════════ */
(async function checkOauthCallback(){
  if (!location.hash) return;
  const m = location.hash.match(/access=([^&]+)/);
  if (m) {
    const accessToken = m[1];
    try {
      const resp = await fetch(API_BASE + "/api/auth/me/", {
        headers: { Authorization: "Bearer " + accessToken },
      });
      if (resp.ok) {
        const user = await resp.json();
        setAuth(accessToken, user);
        location.hash = "";
        history.replaceState(null, "", location.pathname + location.search);
        toast("Logged in as " + (user.github_username || user.username));
      }
    } catch (e) {
      console.warn("OAuth callback: could not fetch profile", e);
    }
  }
})();

    <section style="margin-top:32px;">
      <h2>History</h2>
      ${items.length ? `
        <table>
          <thead><tr><th>Amount</th><th>Card</th><th>Status</th><th>Requested</th><th>Note</th></tr></thead>
          <tbody>
            ${items.map(p => `
              <tr>
                <td>${money(p.amount)} UZS</td>
                <td>•••• ${escapeHtml(p.destination_card_last4 || "----")}</td>
                <td><span class="badge ${p.status}">${p.status}</span></td>
                <td>${fmtDate(p.requested_at)}</td>
                <td>${escapeHtml(p.admin_note || "—")}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      ` : `<div class="empty">No payout requests yet.</div>`}
    </section>
  `;

  document.getElementById("payout-form").onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api(`/api/payouts/request/`, {
        method: "POST",
        body: JSON.stringify({
          amount: document.getElementById("p-amount").value,
          card_number: document.getElementById("p-card").value.replace(/\s+/g, ""),
        }),
      });
      toast("Payout requested.");
      render();
    } catch (err) { toast(err.message, true); }
  };
});

/* ══════════════════════════════════════════════════════════════════════
   API Tester — comprehensive endpoint checker

route("/api-tester", async () => {
  const app = document.getElementById("app");

  const endpoints = [
    // Health
    { group: "System", method: "GET", path: "/api/health/", desc: "Health check" },

    // Auth
    { group: "Auth", method: "GET", path: "/api/auth/me/", desc: "Current user profile", auth: true },
    { group: "Auth", method: "GET", path: "/api/auth/github/login/", desc: "GitHub OAuth start" },

    // Listings
    { group: "Listings", method: "GET", path: "/api/listings/", desc: "Public marketplace (published)" },
    { group: "Listings", method: "GET", path: "/api/listings/categories/", desc: "All categories" },
    { group: "Listings", method: "GET", path: "/api/listings/projects/", desc: "My projects (seller)", auth: true },
    { group: "Listings", method: "GET", path: "/api/listings/my-repos/", desc: "My GitHub repos (seller)", auth: true },

    // Dashboard
    { group: "Dashboard", method: "GET", path: "/api/dashboard/summary/", desc: "Seller summary stats", auth: true },
    { group: "Dashboard", method: "GET", path: "/api/dashboard/sales/", desc: "Paginated sales", auth: true },
    { group: "Dashboard", method: "GET", path: "/api/dashboard/listings/", desc: "Listings with stats", auth: true },
    { group: "Dashboard", method: "GET", path: "/api/dashboard/earnings-timeseries/?range=30d", desc: "Daily earnings chart data", auth: true },

    // Payouts
    { group: "Payouts", method: "GET", path: "/api/payouts/mine/", desc: "My payout history + balance", auth: true },
    { group: "Payouts", method: "POST", path: "/api/payouts/request/", desc: "Request payout", auth: true,
      body: { amount: "10000", card_number: "8600123412345678" } },

    // Payments
    { group: "Payments", method: "GET", path: "/api/payments/mirpay/balance/", desc: "MirPay kassa balance (staff)", auth: true },

    // JWT
    { group: "JWT", method: "POST", path: "/api/token/", desc: "Obtain JWT (username/password)",
      body: { username: "", password: "" } },
    { group: "JWT", method: "POST", path: "/api/token/refresh/", desc: "Refresh JWT",
      body: { refresh: "" } },
  ];

  const groups = [...new Set(endpoints.map(e => e.group))];

  app.innerHTML = `
    <p class="eyebrow">API Tester</p>
    <h1>Endpoint explorer</h1>
    <p class="muted">Hit every Cooplink API endpoint from here. Results include status code, timing, and full JSON response.
      ${state.token ? `<span style="color:var(--accent);">✓ Authenticated</span>` : `<span style="color:var(--danger);">✗ Not authenticated — some endpoints will return 401</span>`}</p>

    <div style="margin:18px 0;">
      <button class="btn primary" id="run-all-btn">▶ Run all GET endpoints</button>
    </div>

    ${groups.map(group => `
      <section>
        <h2>${escapeHtml(group)}</h2>
        ${endpoints.filter(e => e.group === group).map((ep, i) => {
          const id = `api-${group}-${i}`;
          return `
            <details class="api-panel" id="${id}">
              <summary>
                <span class="method ${ep.method.toLowerCase()}">${ep.method}</span>
                ${escapeHtml(ep.path)}
                ${ep.auth ? '<span style="font-size:10px;color:var(--money);margin-left:6px;">🔒 auth</span>' : ''}
                <span style="float:right;font-size:12px;color:var(--muted);">${escapeHtml(ep.desc)}</span>
              </summary>
              ${ep.body ? `
                <div class="api-input-row">
                  ${Object.keys(ep.body).map(k => `
                    <label>${k}
                      <input type="text" class="api-field" data-key="${k}" value="${escapeHtml(ep.body[k])}" placeholder="${k}" />
                    </label>
                  `).join("")}
                </div>
              ` : ""}
              <div class="api-input-row" style="margin-top:8px;">
                <button class="btn btn-sm primary api-run-btn" data-endpoint='${JSON.stringify(ep)}' data-id="${id}">
                  ▶ Send
                </button>
                <span class="api-timing" id="${id}-timing" style="font-family:var(--mono);font-size:11px;color:var(--muted);"></span>
              </div>
              <div class="api-result" id="${id}-result" style="display:none;"></div>
            </details>
          `;
        }).join("")}
      </section>
    `).join("")}
  `;

  // individual endpoint runners
  document.querySelectorAll(".api-run-btn").forEach(btn => {
    btn.onclick = async () => {
      const ep = JSON.parse(btn.dataset.endpoint);
      const id = btn.dataset.id;
      const panel = document.getElementById(id);

      // collect form inputs if any
      let body = null;
      if (ep.body) {
        body = {};
        panel.querySelectorAll(".api-field").forEach(input => {
          body[input.dataset.key] = input.value;
        });
      }

      await runEndpoint(ep, id, body);
    };
  });

  // run all GET endpoints
  document.getElementById("run-all-btn").onclick = async () => {
    const gets = endpoints.filter(e => e.method === "GET");
    for (const ep of gets) {
      const idx = endpoints.filter(e => e.group === ep.group).indexOf(ep);
      const id = `api-${ep.group}-${idx}`;
      const panel = document.getElementById(id);
      if (panel) panel.open = true;
      await runEndpoint(ep, id, null);
    }
  };
});

async function runEndpoint(ep, id, body) {
  const resultEl = document.getElementById(id + "-result");
  const timingEl = document.getElementById(id + "-timing");
  resultEl.style.display = "block";
  resultEl.className = "api-result";
  resultEl.textContent = "loading…";
  timingEl.textContent = "";

  const opts = { method: ep.method };
  if (body && ep.method !== "GET") {
    opts.body = JSON.stringify(body);
  }

  const start = performance.now();
  const res = await apiRaw(ep.path, opts);
  const elapsed = (performance.now() - start).toFixed(0);

  timingEl.textContent = `${res.status} · ${elapsed}ms`;
  resultEl.className = "api-result " + (res.ok ? "ok" : "err");
  resultEl.textContent = typeof res.body === "object" ? JSON.stringify(res.body, null, 2) : String(res.body);
}
